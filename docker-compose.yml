# Phase 1: PostgreSQL + pgvector only.
# FastAPI runs on the host (uvicorn), not in Docker — simpler for debugging.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db          # matches DATABASE_URL in .env
    ports:
      - "5433:5432"                # host 5433 → container 5432 (avoid local 5432 conflict)
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first container start (empty volume):
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:                            # named volume — data survives `docker compose down`